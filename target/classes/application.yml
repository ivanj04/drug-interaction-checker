spring:
  application:
    name: drug-interaction-checker
  profiles:
    active: dev
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=3600s

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:drugdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

app:
  jwt:
    secret: supersecretkey32charsminimumhere!
    expiration-ms: 86400000

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/drugdb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:druguser}
    password: ${DATABASE_PASSWORD:drugpass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:supersecretkey32charsminimumhere!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
