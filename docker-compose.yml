version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: drugdb-postgres
    environment:
      POSTGRES_DB: drugdb
      POSTGRES_USER: druguser
      POSTGRES_PASSWORD: drugpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druguser -d drugdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drug-interaction-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/drugdb
      DATABASE_USER: druguser
      DATABASE_PASSWORD: drugpass
      JWT_SECRET: ${JWT_SECRET:-supersecretkey32charsminimumhere!}
      JWT_EXPIRATION_MS: 86400000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
